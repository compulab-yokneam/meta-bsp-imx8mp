# Build one all-capacity U-Boot image per supported hardware target.
# Only the explicit u-boot-compulab-multi target consumes these dependencies.
COMPULAB_UBOOT_MULTI_CONFIGS = " \
    iot-gate-imx8plus \
    iot-gate-imx8pv2 \
    iotdin-imx8p \
    mcm-imx8m-plus \
    mcm-imx8pv2 \
    som-imx8m-plus \
    ucm-imx8m-plus \
    ucm-imx8m-plus-sbev \
"

BBMULTICONFIG = "${COMPULAB_UBOOT_MULTI_CONFIGS}"

# Each entry is multiconfig:machine.
COMPULAB_UBOOT_MULTI_MATRIX = " \
    iot-gate-imx8plus:iot-gate-imx8plus \
    iot-gate-imx8pv2:iot-gate-imx8pv2 \
    iotdin-imx8p:iotdin-imx8p \
    mcm-imx8m-plus:mcm-imx8m-plus \
    mcm-imx8pv2:mcm-imx8pv2 \
    som-imx8m-plus:som-imx8m-plus \
    ucm-imx8m-plus:ucm-imx8m-plus \
    ucm-imx8m-plus-sbev:ucm-imx8m-plus-sbev \
"
