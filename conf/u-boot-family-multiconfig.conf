# Build every supported CompuLab i.MX8MP U-Boot and DRAM combination.
COMPULAB_UBOOT_MULTI_CONFIGS = " \
    iot-gate-imx8plus-d1d8 \
    iot-gate-imx8plus-d2d4 \
    iotdin-imx8p-d1d8 \
    iotdin-imx8p-d2d4 \
    mcm-imx8m-plus-d1d8 \
    mcm-imx8m-plus-d2d4 \
    som-imx8m-plus-d1d8 \
    som-imx8m-plus-d2d4 \
    ucm-imx8m-plus-d1d8 \
    ucm-imx8m-plus-d2d4 \
    ucm-imx8m-plus-sbev-d1d8 \
    ucm-imx8m-plus-sbev-d2d4 \
"

BBMULTICONFIG = "${COMPULAB_UBOOT_MULTI_CONFIGS}"

# Each entry is multiconfig:machine:DRAM_CONF. The aggregate recipe uses this
# mapping to locate and name each independently deployed boot container.
COMPULAB_UBOOT_MULTI_MATRIX = " \
    iot-gate-imx8plus-d1d8:iot-gate-imx8plus:d1d8 \
    iot-gate-imx8plus-d2d4:iot-gate-imx8plus:d2d4 \
    iotdin-imx8p-d1d8:iotdin-imx8p:d1d8 \
    iotdin-imx8p-d2d4:iotdin-imx8p:d2d4 \
    mcm-imx8m-plus-d1d8:mcm-imx8m-plus:d1d8 \
    mcm-imx8m-plus-d2d4:mcm-imx8m-plus:d2d4 \
    som-imx8m-plus-d1d8:som-imx8m-plus:d1d8 \
    som-imx8m-plus-d2d4:som-imx8m-plus:d2d4 \
    ucm-imx8m-plus-d1d8:ucm-imx8m-plus:d1d8 \
    ucm-imx8m-plus-d2d4:ucm-imx8m-plus:d2d4 \
    ucm-imx8m-plus-sbev-d1d8:ucm-imx8m-plus-sbev:d1d8 \
    ucm-imx8m-plus-sbev-d2d4:ucm-imx8m-plus-sbev:d2d4 \
"
