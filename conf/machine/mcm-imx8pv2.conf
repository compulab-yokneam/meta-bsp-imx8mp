#@TYPE: Machine
#@NAME: CompuLab MCM-iMX8Pv2 on SBC-MCM8PV2
#@SOC: i.MX8MP
#@DESCRIPTION: Machine configuration for CompuLab MCM-iMX8Pv2 and SBC-MCM8PV2
#@MAINTAINER: compulab@compulab.co.il

require compulab-imx8mp.inc

KERNEL_DEVICETREE = " \
    compulab/mcm-imx8pv2.dtb \
    compulab/mcm-imx8pv2-som.dtb \
"

UBOOT_DTB_NAME = "mcm-imx8pv2.dtb"

# One U-Boot image supports every DRAM capacity and probes its identity.
# DRAM_CONF labels the deployed image; its fragments are selected separately.
DRAM_CONF:mcm-imx8pv2 = "d1d2d4d8"
COMPULAB_DRAM_MULTICONFIG_ENABLED:mcm-imx8pv2 = "0"

# The initial carrier device tree enables Ethernet and displays; PCIe,
# Wi-Fi and Bluetooth are not enabled yet.
MACHINE_FEATURES:remove = "pci wifi bluetooth"
