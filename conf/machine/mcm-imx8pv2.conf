#@TYPE: Machine
#@NAME: CompuLab MCM-iMX8Pv2 on SBC-MCM8PV2
#@SOC: i.MX8MP
#@DESCRIPTION: Machine configuration for CompuLab MCM-iMX8Pv2 and SBC-MCM8PV2
#@MAINTAINER: compulab@compulab.co.il

require compulab-imx8mp.inc

KERNEL_DEVICETREE = " \
    compulab/mcm-imx8pv2.dtb \
    compulab/mcm-imx8pv2-som.dtb \
    compulab/mcm-imx8pv2-base.dtb \
    compulab/sbc-mcm8pv2-headless.dtb \
    compulab/sbc-mcm8pv2-hdmi.dtb \
    compulab/sbc-mcm8pv2-lvds.dtb \
    compulab/sbc-mcm8pv2-mipi.dtb \
    compulab/sbc-mcm8pv2-dualhead.dtb \
    compulab/sbc-mcm8pv2.dtbo \
    compulab/sbc-mcm8pv2-enet.dtbo \
    compulab/sbc-mcm8pv2-enet1.dtbo \
    compulab/sbc-mcm8pv2-lvds.dtbo \
    compulab/sbc-mcm8pv2-mipi.dtbo \
    compulab/sbc-mcm8pv2-hdmi.dtbo \
    compulab/sbc-mcm8pv2-wm8962.dtbo \
    compulab/sbc-mcm8pv2-p17_can.dtbo \
    compulab/sbc-mcm8pv2-p19_uart-b.dtbo \
    compulab/sbc-mcm8pv2-p20_uart-a.dtbo \
    compulab/sbc-mcm8pv2-p15_spi.dtbo \
    compulab/sbc-mcm8pv2-p16_spi.dtbo \
    compulab/sbc-mcm8pv2-p16_i2c.dtbo \
    compulab/sbc-mcm8pv2-p18_gpio.dtbo \
"

UBOOT_DTB_NAME = "mcm-imx8pv2.dtb"

# One U-Boot image supports every DRAM capacity and probes its identity.
# DRAM_CONF labels the deployed image; its fragments are selected separately.
DRAM_CONF:mcm-imx8pv2 = "d1d2d4d8"
COMPULAB_DRAM_MULTICONFIG_ENABLED:mcm-imx8pv2 = "0"

# The carrier device trees enable Ethernet, displays and audio; PCIe,
# Wi-Fi and Bluetooth are not enabled yet.
MACHINE_FEATURES:remove = "pci wifi bluetooth"
