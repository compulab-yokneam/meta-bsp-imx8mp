#@TYPE: Machine
#@NAME: CompuLab IOT-GATE-IMX8PV2 - Industrial IoT Gateway
#@SOC: i.MX8MP
#@DESCRIPTION: Machine configuration for IOT-GATE-IMX8PV2
#@MAINTAINER: compulab@compulab.co.il

require compulab-imx8mp.inc

KERNEL_DEVICETREE = " \
	compulab/iot-gate-imx8pv2.dtb \
"

UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[sd] = "iot-gate-imx8pv2_defconfig,sdcard"
UBOOT_CONFIG[mfgtool] = "iot-gate-imx8pv2_defconfig"
#
# Set u-boot DTB
UBOOT_DTB_NAME = "iot-gate-imx8plus.dtb"

KERNEL_CONFIG = "iot-gate-imx8pv2_defconfig"

# IMAGE_INSTALL:append = " iot-gate-imx8plus-config "

CORE_IMAGE_EXTRA_INSTALL += " gpsd gps-utils ppp modemmanager "
