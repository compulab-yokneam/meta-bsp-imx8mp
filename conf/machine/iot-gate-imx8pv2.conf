#@TYPE: Machine
#@NAME: CompuLab IOT-GATE-IMX8PV2 - Industrial IoT Gateway
#@SOC: i.MX8MP
#@DESCRIPTION: Machine configuration for IOT-GATE-IMX8PV2
#@MAINTAINER: compulab@compulab.co.il

require compulab-imx8mp.inc

KERNEL_DEVICETREE = "${COMPULAB_IOT_GATE_IMX8PV2_DEVICETREES}"
#
# Set u-boot DTB
UBOOT_DTB_NAME = "iot-gate-imx8pv2.dtb"

# IMAGE_INSTALL:append = " ${COMPULAB_IOT_GATE_IMX8PV2_IMAGE_INSTALL} "

CORE_IMAGE_EXTRA_INSTALL += " ${COMPULAB_IOT_GATE_IMX8PV2_CORE_IMAGE_EXTRA_INSTALL} "

MACHINE_FIRMWARE:append = " firmware-nxp-wifi-nxpiw612-sdio "

COMPULAB_BOOTLOADER_MACHINES = "${MACHINE}"

CORE_IMAGE_EXTRA_INSTALL:append = " compulab-bootloader "
