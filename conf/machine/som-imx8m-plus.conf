require compulab-imx8mp.inc

MACHINE_FEATURES:append:use-nxp-bsp = " ${COMPULAB_SOM_IMX8M_PLUS_MACHINE_FEATURES} "

KERNEL_DEVICETREE = "${COMPULAB_SOM_IMX8M_PLUS_DEVICETREES}"

# Set u-boot DTB
UBOOT_DTB_NAME = "som-imx8m-plus.dtb"

CORE_IMAGE_EXTRA_INSTALL += " ${COMPULAB_SOM_IMX8M_PLUS_CORE_IMAGE_EXTRA_INSTALL} "
