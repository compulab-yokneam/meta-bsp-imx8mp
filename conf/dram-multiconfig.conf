# Enable the supported i.MX8MP DRAM configurations for an optional
# multiconfig U-Boot build.
COMPULAB_DRAM_MULTICONFIG = "1"
BBMULTICONFIG = "d1d8 d2d4"

# Describe the selected multiconfig outputs to the aggregate target.
COMPULAB_UBOOT_MULTI_CONFIGS = "d1d8 d2d4"
COMPULAB_UBOOT_MULTI_MATRIX = " \
    d1d8:${MACHINE}:d1d8 \
    d2d4:${MACHINE}:d2d4 \
"

# The base configuration supplies the WKS bootloader and owns the package.
COMPULAB_DRAM_MULTICONFIG_DEFAULT = "d2d4"
